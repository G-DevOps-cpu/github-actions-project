name: Advanced delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopfast-production
  cancel-in-progress: false
jobs:
  release:
    if: vars.ENABLE_ADVANCED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Name and build the image once
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$VERSION-$GITHUB_SHA" .
      - name: Scan before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Authenticate to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the scanned image and record its digest
        id: publish
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$VERSION-$GITHUB_SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '### Release\nImage: `%s`\nCommit: `%s`\n' "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: release
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy the published digest
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/ssh-deploy.sh
